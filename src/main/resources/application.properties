# ============================================================================
# application.properties -- every knob the app reads at startup.
# Spring Boot loads this automatically from src/main/resources.
#
# Tip learned the hard way: if you edit this file in an IDE and don't SAVE it,
# the app starts with the OLD values and you get confusing errors like
# "url attribute is not specified". Always check the file is saved first.
# ============================================================================

spring.application.name=self-checkout

# Postgres lives: host localhost, port 5432, database self_checkout
# NOTE: this must be the real database name (the one `createdb` made), not the
# friendly label a GUI like pgAdmin shows in its connection tree.
spring.datasource.url=jdbc:postgresql://localhost:5432/self_checkout

# Homebrew Postgres installation
# Blank password is fine here because Homebrew sets up "trust" auth locally.
spring.datasource.username=rohitdabhi
spring.datasource.password=

# Don't let Hibernate create or alter tables on its own. We'll control the schema ourselves
# (via schema.sql). Any mismatch between the entities and the tables then shows
# up as an honest error instead of Hibernate quietly "fixing" the database.
spring.jpa.hibernate.ddl-auto=none

# Run schema.sql then data.sql on every boot. This is what makes "restart" the
# reset button for the whole project.
spring.sql.init.mode=always
# --- domain tunables (Phases 3 and 4) ---
# A SKU is "low" when stock is strictly below this ("drops below" in the spec).
selfcheckout.low-stock-threshold=50
# Popular items: hopping window over the most recent N scans, recomputed every M scans.
selfcheckout.popular-window-size=1000
selfcheckout.popular-slide-interval=500

# --- performance configuration (Phase 5) ---

# Do NOT keep the JPA session (and its pooled DB connection) open while the
# response is being serialized. Every controller here returns a record that was
# fully built inside the service transaction, and no entity has a lazy
# association, so nothing needs the session after the service returns. Leaving
# this on would hold a connection for the whole response and shrink effective
# pool capacity for no benefit.
spring.jpa.open-in-view=false

# Connection pool. Sized deliberately, not by default:
#   * Postgres max_connections is 100 on this machine and psql/pgAdmin need
#     room too, so the app must stay well under that.
#   * This box has 8 cores. A pool far larger than the core count does not add
#     throughput -- under the stress run the bottleneck is the row lock on the
#     hottest SKUs, not CPU, and extra connections just add backend overhead.
#   * It must still be comfortably bigger than the number of completions that
#     can be queued on a hot SKU at once, otherwise fast scans (which take no
#     item locks at all) get stuck behind slow completions waiting for a
#     connection -- head-of-line blocking in the pool rather than in the DB.
# 32 balances those three. It is a starting point chosen from the constraints
# above and is meant to be re-tuned from measurements, not treated as final.
# Measured later: at 100 stations this pool is fully saturated, with about two
# thirds of request threads parked waiting for a connection. See
# ARCHITECTURE.md section 3.1.
spring.datasource.hikari.maximum-pool-size=32
spring.datasource.hikari.minimum-idle=8
spring.datasource.hikari.pool-name=self-checkout-pool

# Keep SQL logging off for load runs: per-statement logging would dominate the
# measurement and make the reported latencies meaningless.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
