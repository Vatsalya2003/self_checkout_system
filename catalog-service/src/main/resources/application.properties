# ============================================================================
# catalog-service -- GET /items. Reads the catalog once into memory.
# ============================================================================
spring.application.name=catalog-service
server.port=8081

# Week 5: its OWN database. Only catalog_svc may connect to catalog_db, and
# catalog_svc may connect to nothing else (db/reset.sh, db/roles.sql).
spring.datasource.url=jdbc:postgresql://localhost:5432/catalog_db
spring.datasource.username=catalog_svc
spring.datasource.password=

# Never touch the schema from a service: db/reset.sh creates and seeds all
# four databases before the services start.
spring.sql.init.mode=never

# Connection budget (Postgres max_connections = 100, see MICROSERVICES.md):
# the catalog is read once and then served from memory, so 2 is plenty.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.pool-name=catalog-pool

# Week 6: the other services no longer call GET /items here; they send
# CatalogRequested to catalog.requests, and this service broadcasts the
# catalog as CatalogPublished on the catalog.snapshots fanout exchange (also
# once at startup). GET /items stays for the load client, via the gateway.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.listener.simple.acknowledge-mode=auto
selfcheckout.messaging.watch-dlq=catalog.requests

# Rate limiter (rate-limit module; RATE_LIMITER.md). This rule exists to show
# the limit is SHARED: catalog can run as two instances (scripts/start-all.sh
# --two-catalogs starts a second one on :8085 behind the same gateway), and
# both check the same Redis bucket, so together they admit 100 per second, not
# 200. Nothing on the checkout path calls GET /items (the load client asks
# once at start-up), so this limit never touches a load run.
ratelimit.enabled=true
ratelimit.rules[0].name=catalog-reads
ratelimit.rules[0].method=GET
ratelimit.rules[0].path=/items
ratelimit.rules[0].key=global
ratelimit.rules[0].rate-per-second=100
ratelimit.rules[0].burst=20
# How many catalog instances share the limit; only used while Redis is down
# (each then allows 100 / n on its own). start-all.sh --two-catalogs sets 2.
ratelimit.fallback-instances=1

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=20ms
spring.data.redis.connect-timeout=100ms
