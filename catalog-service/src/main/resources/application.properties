# ============================================================================
# catalog-service -- GET /items. Reads the catalog once into memory.
# ============================================================================
spring.application.name=catalog-service
server.port=8081

# Week 5: its OWN database. Only catalog_svc may connect to catalog_db, and
# catalog_svc may connect to nothing else (db/reset.sh, db/roles.sql).
spring.datasource.url=jdbc:postgresql://localhost:5432/catalog_db
spring.datasource.username=catalog_svc
spring.datasource.password=

# Never touch the schema from a service: db/reset.sh creates and seeds all
# four databases before the services start.
spring.sql.init.mode=never

# Connection budget (Postgres max_connections = 100, see MICROSERVICES.md):
# the catalog is read once and then served from memory, so 2 is plenty.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.pool-name=catalog-pool
