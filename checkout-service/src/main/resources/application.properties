# ============================================================================
# checkout-service -- start, scan, pay; stock, low-stock alerts, scan_log.
# ============================================================================
spring.application.name=checkout-service
server.port=8082

# All four services share ONE PostgreSQL database -- the assignment's
# "single centralized database". It is the only thing they have in common:
# no service calls another.
spring.datasource.url=jdbc:postgresql://localhost:5432/self_checkout
spring.datasource.username=rohitdabhi
spring.datasource.password=

# Never touch the schema from a service. db/reset.sh is the ONE thing allowed
# to run schema.sql and data.sql, and it runs before the services start.
# (In Weeks 1-3 every boot rebuilt the database; with four processes that
# would mean four rebuilds racing each other.)
spring.sql.init.mode=never

# Don't let Hibernate create or alter tables; db/schema.sql owns the schema.
spring.jpa.hibernate.ddl-auto=none
# Do not hold a connection open while the response is serialized.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# A SKU is "low" when stock drops strictly below this. Must match
# inventory-service, which reports against the same threshold.
selfcheckout.low-stock-threshold=50

# Main pool: 32, unchanged from Week 3 -- measured there as the best of
# 16 / 32 / 64 for throughput (Phase 7 of perf-results.md).
spring.datasource.hikari.maximum-pool-size=32
spring.datasource.hikari.minimum-idle=8
spring.datasource.hikari.pool-name=checkout-pool

# The scan-log writer's own pool (ScanLogWriterPool): 2 connections.
selfcheckout.scan-log.writer-pool-size=2

# Collect scans for up to this long (or 1,000 rows) before one multi-row
# INSERT. Fewer, bigger commits; at most this much extra analytics lag.
selfcheckout.scan-log.max-linger-ms=50
