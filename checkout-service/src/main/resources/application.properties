# ============================================================================
# checkout-service -- start, scan, pay; the sales and receipts.
# Orchestrates the payment saga; pushes every scan to analytics.
# ============================================================================
spring.application.name=checkout-service
server.port=8082

# Week 5: its OWN database. Only checkout_svc may connect to checkout_db, and
# checkout_svc may connect to nothing else (db/reset.sh, db/roles.sql).
spring.datasource.url=jdbc:postgresql://localhost:5432/checkout_db
spring.datasource.username=checkout_svc
spring.datasource.password=

# Never touch the schema from a service: db/reset.sh creates and seeds all
# four databases before the services start.
spring.sql.init.mode=never

# Do not let Hibernate create or alter tables; db/checkout/schema.sql owns them.
spring.jpa.hibernate.ddl-auto=none
# Do not hold a connection open while the response is serialized.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Week 6: every message to or from another service goes through RabbitMQ
# (local broker, default guest account). No service URLs any more.
#   out: CatalogRequested (catalog.requests), StockCommitRequested
#        (inventory.stock-commit), ScansRecorded (analytics.scans)
#   in:  CatalogPublished (catalog.snapshots fanout), StockCommitted /
#        StockCommitRejected (checkout.stock-replies)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
# Publisher confirms + returns: ConfirmedPublisher tells "certainly not in the
# queue" (no connection, nack, unroutable) from "maybe" (no confirm in time).
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# Up to ~100 request threads publish at once under stress; keep their
# channels open instead of opening and closing one per payment.
spring.rabbitmq.cache.channel.size=128
# One attempt at the pivot: wait this long for the broker's confirm, then this
# long for inventory's reply. The payment keeps retrying for up to 3 s.
selfcheckout.inventory.confirm-timeout-ms=1000
selfcheckout.inventory.reply-timeout-ms=2500
# Replies are tiny and only complete a waiting future: 4 consumers is plenty.
selfcheckout.stock-replies.consumers=4
spring.rabbitmq.listener.simple.prefetch=50
spring.rabbitmq.listener.simple.acknowledge-mode=auto
selfcheckout.messaging.watch-dlq=checkout.stock-replies

# Main pool: 16. Checkout no longer holds any row lock -- tx A and tx B are
# short local writes, and no connection is held while waiting for inventory
# -- so it no longer needs the 32 it had while stock lived here. (Inventory
# has those 32 now.) Connection budget: MICROSERVICES.md.
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.minimum-idle=8
spring.datasource.hikari.pool-name=checkout-pool

# Collect scans for up to this long (or 1,000) before one push to analytics.
selfcheckout.scan-log.max-linger-ms=50

# TEST HOOK for the crash-mid-saga failure test: halt this process right after
# inventory confirms a stock commit, before tx B. NEVER on in a load run.
selfcheckout.test.halt-after-stock-commit=false
