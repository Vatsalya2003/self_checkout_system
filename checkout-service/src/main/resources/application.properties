# ============================================================================
# checkout-service -- start, scan, pay; the sales and receipts.
# Orchestrates the payment saga; pushes every scan to analytics.
# ============================================================================
spring.application.name=checkout-service
server.port=8082

# Week 5: its OWN database. Only checkout_svc may connect to checkout_db, and
# checkout_svc may connect to nothing else (db/reset.sh, db/roles.sql).
spring.datasource.url=jdbc:postgresql://localhost:5432/checkout_db
spring.datasource.username=checkout_svc
spring.datasource.password=

# Never touch the schema from a service: db/reset.sh creates and seeds all
# four databases before the services start.
spring.sql.init.mode=never

# Do not let Hibernate create or alter tables; db/checkout/schema.sql owns them.
spring.jpa.hibernate.ddl-auto=none
# Do not hold a connection open while the response is serialized.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# The other services, called directly on their own ports.
selfcheckout.catalog.url=http://localhost:8081
selfcheckout.inventory.url=http://localhost:8083
selfcheckout.analytics.url=http://localhost:8084
# How long one stock-commit call may wait for inventory's answer before it
# counts as "no answer". The payment keeps retrying for up to 3 s in total.
selfcheckout.inventory.read-timeout-ms=2500

# Main pool: 16. Checkout no longer holds any row lock -- tx A and tx B are
# short local writes, and no connection is held while waiting for inventory
# -- so it no longer needs the 32 it had while stock lived here. (Inventory
# has those 32 now.) Connection budget: MICROSERVICES.md.
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.minimum-idle=8
spring.datasource.hikari.pool-name=checkout-pool

# Collect scans for up to this long (or 1,000) before one push to analytics.
selfcheckout.scan-log.max-linger-ms=50

# TEST HOOK for the crash-mid-saga failure test: halt this process right after
# inventory confirms a stock commit, before tx B. NEVER on in a load run.
selfcheckout.test.halt-after-stock-commit=false
