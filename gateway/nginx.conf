# ============================================================================
# The gateway: the one "absolutely necessary" shared runtime piece.
#
# The load client (and the OpenAPI contract) has ONE base URL, so something on
# :8080 has to send each request to the service that owns it. This file is
# that something: a plain reverse proxy that routes by path and holds no
# business logic. The services never call each other through it -- it only
# carries client requests in, and responses back out. (Since Week 5 the
# services DO call each other, but directly on their own ports.)
#
#   /items              -> catalog-service    :8081
#   /transactions/**    -> checkout-service   :8082
#   /inventory/**       -> inventory-service  :8083
#   /analytics/**       -> analytics-service  :8084
#   /internal/**        -> 404, answered by nginx itself (Week 5): the
#                          service-to-service endpoints (stock commit, scan
#                          push) are never reachable from outside
#   anything else       -> catalog-service    (so an unknown route still gets
#                          the exact same Spring 404 body as before the split)
#
# Started by scripts/start-all.sh as:
#   nginx -p gateway/ -c nginx.conf
# so every relative path below is under gateway/ (runtime files in gateway/run/).
# ============================================================================

# Two workers: enough to keep up with ~13,000 requests/s on this machine
# while leaving the 8 cores to the four JVMs, Postgres and the load client.
worker_processes 2;
pid run/nginx.pid;
error_log run/error.log warn;

events {
    worker_connections 4096;
}

http {
    # One log line per request would be ~13,000 writes a second under load:
    # measurable cost for no benefit. Errors still go to run/error.log.
    access_log off;

    client_body_temp_path run/client_body;
    proxy_temp_path       run/proxy;
    fastcgi_temp_path     run/fastcgi;
    uwsgi_temp_path       run/uwsgi;
    scgi_temp_path        run/scgi;

    # Keep the load client's connections open (it reuses them).
    keepalive_timeout 65;
    keepalive_requests 1000000;

    # Keep-alive to the services, too: without it every request would open a
    # brand-new TCP connection to the upstream, and that extra connect would
    # dominate the cost of the hop. "keepalive N" is the number of IDLE
    # connections each worker keeps per upstream; checkout gets the most
    # because ~12 of every 13 requests go there.
    upstream catalog   { server 127.0.0.1:8081; keepalive 16;  keepalive_requests 1000000; }
    upstream checkout  { server 127.0.0.1:8082; keepalive 128; keepalive_requests 1000000; }
    upstream inventory { server 127.0.0.1:8083; keepalive 8;   keepalive_requests 1000000; }
    upstream analytics { server 127.0.0.1:8084; keepalive 8;   keepalive_requests 1000000; }

    # Upstream keep-alive needs HTTP/1.1 and an empty Connection header
    # (nginx would otherwise send "Connection: close" to the service).
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    server {
        listen 8080;

        # Internal service-to-service endpoints: refused here, before any
        # service sees the request. "^~" makes this prefix win over every
        # other location, so no route below can ever reach /internal/.
        location ^~ /internal/  { return 404; }

        # proxy_pass with no URI part forwards the request path unchanged.
        location = /items       { proxy_pass http://catalog; }
        location /transactions  { proxy_pass http://checkout; }
        location /inventory/    { proxy_pass http://inventory; }
        location /analytics/    { proxy_pass http://analytics; }

        # Unmatched paths: let a Spring service answer, so the 404 body stays
        # byte-for-byte what the single application returned.
        location /              { proxy_pass http://catalog; }
    }
}
