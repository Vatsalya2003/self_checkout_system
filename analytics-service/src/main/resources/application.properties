# ============================================================================
# analytics-service -- the popular-items pipeline, fed from scan_log.
# ============================================================================
spring.application.name=analytics-service
server.port=8084

# Week 5: its OWN database. Only analytics_svc may connect to analytics_db,
# and analytics_svc may connect to nothing else (db/reset.sh, db/roles.sql).
# checkout-service publishes scans to RabbitMQ (analytics.scans, Week 6); this
# service numbers them and stores them in its own scan_log.
spring.datasource.url=jdbc:postgresql://localhost:5432/analytics_db
spring.datasource.username=analytics_svc
spring.datasource.password=

# Never touch the schema from a service: db/reset.sh creates and seeds all
# four databases before the services start.
spring.sql.init.mode=never

# Do not let Hibernate create or alter tables; db/analytics/schema.sql owns them.
spring.jpa.hibernate.ddl-auto=none
# Do not hold a connection open while the response is serialized.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Hopping window over the most recent N scans, recomputed every M scans.
selfcheckout.popular-window-size=1000
selfcheckout.popular-slide-interval=500

# 6 connections: the poller, the sink, the scan ingest (the analytics.scans
# consumer)
# and the rest for GET /analytics/popular-items and startup. Budget: MICROSERVICES.md.
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=analytics-pool

# Week 6: everything this service hears from another service arrives through
# RabbitMQ (local broker, default guest account).
#   in:  ScansRecorded on analytics.scans (from checkout)
#        CatalogPublished on the catalog.snapshots fanout (item names)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# One consumer on analytics.scans (set on the listener itself), so batches are
# stored one at a time, in order. Up to 10 batches are fetched ahead of time;
# they are still processed one by one, in order. Acked after the commit.
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.acknowledge-mode=auto
selfcheckout.messaging.watch-dlq=analytics.scans
