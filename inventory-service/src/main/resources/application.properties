# ============================================================================
# inventory-service -- GET /inventory/low-stock. Read-only.
# ============================================================================
spring.application.name=inventory-service
server.port=8083

# All four services share ONE PostgreSQL database -- the assignment's
# "single centralized database". It is the only thing they have in common:
# no service calls another.
spring.datasource.url=jdbc:postgresql://localhost:5432/self_checkout
# Its own role, granted only what this service uses (db/roles.sql).
spring.datasource.username=inventory_svc
spring.datasource.password=

# Never touch the schema from a service. db/reset.sh is the ONE thing allowed
# to run schema.sql and data.sql, and it runs before the services start.
# (In Weeks 1-3 every boot rebuilt the database; with four processes that
# would mean four rebuilds racing each other.)
spring.sql.init.mode=never

# Don't let Hibernate create or alter tables; db/schema.sql owns the schema.
spring.jpa.hibernate.ddl-auto=none
# Do not hold a connection open while the response is serialized.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Same threshold checkout-service records crossings against.
selfcheckout.low-stock-threshold=50

# Low volume: the load client asks once at the end of a run.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.pool-name=inventory-pool
