# ============================================================================
# inventory-service -- stock and low-stock alerts, in its own database.
#   GET  /inventory/low-stock      (public)
#   POST /internal/stock/commit    (internal: the stock half of a payment)
# ============================================================================
spring.application.name=inventory-service
server.port=8083

# Week 5: its OWN database. Only inventory_svc may connect to inventory_db,
# and inventory_svc may connect to nothing else (db/reset.sh, db/roles.sql).
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=inventory_svc
spring.datasource.password=

# Never touch the schema from a service: db/reset.sh creates and seeds all
# four databases before the services start.
spring.sql.init.mode=never

# A SKU is "low" when stock drops strictly below this. Inventory records the
# crossing (inside the stock commit) and reports it, so it is set only here.
selfcheckout.low-stock-threshold=50

# Item names for the low-stock report come from catalog-service.
selfcheckout.catalog.url=http://localhost:8081

# Main pool: 32. Inventory now holds the item row locks, so it inherits the
# pool size checkout had through Week 4 (measured in Week 3 as the best of
# 16 / 32 / 64 for throughput: at 100 stations most connections sit queued
# for the hottest SKU's lock). Connection budget: MICROSERVICES.md.
spring.datasource.hikari.maximum-pool-size=32
spring.datasource.hikari.minimum-idle=8
spring.datasource.hikari.pool-name=inventory-pool
