# ============================================================================
# inventory-service -- stock and low-stock alerts, in its own database.
#   GET  /inventory/low-stock      (public)
#   StockCommitRequested events    (from checkout, through RabbitMQ: the stock
#                                   half of a payment)
# ============================================================================
spring.application.name=inventory-service
server.port=8083

# Week 5: its OWN database. Only inventory_svc may connect to inventory_db,
# and inventory_svc may connect to nothing else (db/reset.sh, db/roles.sql).
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=inventory_svc
spring.datasource.password=

# Never touch the schema from a service: db/reset.sh creates and seeds all
# four databases before the services start.
spring.sql.init.mode=never

# A SKU is "low" when stock drops strictly below this. Inventory records the
# crossing (inside the stock commit) and reports it, so it is set only here.
selfcheckout.low-stock-threshold=50

# Week 6: everything this service hears from or says to another service goes
# through RabbitMQ (local broker, default guest account).
#   in:  StockCommitRequested on inventory.stock-commit (from checkout)
#        CatalogPublished on the catalog.snapshots fanout (item names for the
#        low-stock report)
#   out: StockCommitted / StockCommitRejected on checkout.stock-replies
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
# Publisher confirms + returns: a reply counts as sent only once the broker
# has acked it (ConfirmedPublisher).
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# Competing consumers: 32 at once, matching the 32-connection pool below, each
# taking one request at a time (prefetch 1), so a slow payment never holds
# others back. The ack is sent when the listener returns, i.e. after the
# database commit and the confirmed reply.
selfcheckout.stock-commit.consumers=32
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.cache.channel.size=64
selfcheckout.messaging.watch-dlq=inventory.stock-commit

# Main pool: 32. Inventory now holds the item row locks, so it inherits the
# pool size checkout had through Week 4 (measured in Week 3 as the best of
# 16 / 32 / 64 for throughput: at 100 stations most connections sit queued
# for the hottest SKU's lock). Connection budget: MICROSERVICES.md.
spring.datasource.hikari.maximum-pool-size=32
spring.datasource.hikari.minimum-idle=8
spring.datasource.hikari.pool-name=inventory-pool
